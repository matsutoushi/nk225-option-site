name: daily-update

on:
  schedule:
    # JPXの公表(出来高16時台 / 手口17:45頃 / 建玉20:00頃)を追いかけて平日に複数回チェック。
    # 新しいデータが出た回だけビルド&デプロイし、未更新ならスキップする。
    #
    # GitHubのスケジュール実行はベストエフォートで、混雑時は遅延・スキップされる。
    # ちょうどの分(00/05/30分など)は多くのリポジトリと重なって落ちやすいため、
    # 半端な分を指定し、取りこぼしに備えて各時間帯に予備の回を持たせている。
    # (JST: 16:37 / 17:12 / 17:52 / 18:22 / 19:07 / 20:22 / 20:52 / 21:37)
    - cron: "37 7 * * 1-5"
    - cron: "12 8 * * 1-5"
    - cron: "52 8 * * 1-5"
    - cron: "22 9 * * 1-5"
    - cron: "7 10 * * 1-5"
    - cron: "22 11 * * 1-5"
    - cron: "52 11 * * 1-5"
    - cron: "37 12 * * 1-5"
  workflow_dispatch: {}
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    # ランナー側でコマンドがハングすると concurrency group を握ったままになり、
    # 後続のスケジュール実行が全部キャンセルされる(2026-08-19に6時間半詰まった)。
    # GitHubの上限6時間ではなく、この処理の実測(3〜5分)に見合う上限を置く。
    timeout-minutes: 25
    env:
      # 手動実行・コード変更時は未更新でも必ずビルドする
      FORCE_BUILD: ${{ github.event_name != 'schedule' && '1' || '' }}
      # FRED公式APIキー(未設定でもキャッシュフォールバックで動作)
      FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
      # AdSense。両方をSecretsに登録したときだけ、解説記事の末尾に広告が出る。
      # 未登録なら広告タグは一切出力されない。
      ADSENSE_CLIENT: ${{ secrets.ADSENSE_CLIENT }}
      ADSENSE_SLOT: ${{ secrets.ADSENSE_SLOT }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Japanese fonts
        # apt-get update はミラー不調で無応答になることがある。
        # 取得のタイムアウトを効かせたうえで、ステップ単位でも打ち切る。
        timeout-minutes: 6
        run: |
          for i in 1 2 3; do
            sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=15 -o Acquire::https::Timeout=15 update && break
            echo "apt-get update failed (attempt $i)"
            sleep 5
          done
          sudo apt-get install -y --no-install-recommends fonts-ipaexfont

      - name: Install dependencies
        run: pip install -r pipeline/requirements.txt

      - name: Build site
        id: build
        shell: bash
        run: |
          set -o pipefail
          python pipeline/build.py 2>&1 | tee build.log
          if [ -f site/index.html ]; then
            echo "updated=true" >> "$GITHUB_OUTPUT"
          else
            echo "updated=false" >> "$GITHUB_OUTPUT"
            echo "No new JPX data yet - skipping deploy."
          fi

      - name: Save error log for diagnosis
        if: failure()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f build.log
          git commit -m "ci: build error log"
          git push

      - name: Update Fed research corpus
        # ウォーシュ議長の講演・議会証言とFOMC文書を集める(research/)。
        # FRBのRSSは直近十数件しか載らないので、毎日回して取りこぼしを防ぐ。
        # サイトの生成には使わない資料なので、失敗してもビルドは止めない。
        continue-on-error: true
        timeout-minutes: 8
        run: python research/fetch_warsh.py

      - name: Commit data history
        if: steps.build.outputs.updated == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data research
          git diff --cached --quiet || git commit -m "data: daily update"
          git push

      - name: Email post draft
        if: steps.build.outputs.updated == 'true' && env.MAIL_APP_PASSWORD != ''
        env:
          MAIL_APP_PASSWORD: ${{ secrets.MAIL_APP_PASSWORD }}
        continue-on-error: true
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_APP_PASSWORD }}
          subject: "【X投稿ネタ】日経225オプションデータ更新"
          to: ${{ secrets.MAIL_USERNAME }}
          from: nk225-option-site
          body: file://site/post.txt

      - name: Upload artifact
        if: steps.build.outputs.updated == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        if: steps.build.outputs.updated == 'true'
        uses: actions/deploy-pages@v4
